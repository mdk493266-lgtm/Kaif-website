<button onclick="move(30)">➡️</button>

<script>
let x = 50;

function move(step) {
  x += step;
  if (x < 10) x = 10;
  if (x > 90) x = 90;
  document.getElementById("player").style.left = x + "%";
}
</script><button onclick="jump()">⬆️ Jump</button>

<script>
function jump() {
  let p = document.getElementById("player");
  p.style.bottom = "170px";
  setTimeout(() => {
    p.style.bottom = "80px";
  }, 300);
}
</script><div id="coin"></div>

<style>
#coin{
  width:30px;
  height:30px;
  background:gold;
  border-radius:50%;
  position:fixed;
  left:50%;
  bottom:80px;
}
</style><div id="score">Score: 0</div>

<script>
let score = 0;

setInterval(() => {
  let player = document.getElementById("player");
  let coin = document.getElementById("coin");

  if (!player || !coin) return;

  let p = player.getBoundingClientRect();
  let c = coin.getBoundingClientRect();

  if (
    p.left < c.right &&
    p.right > c.left &&
    p.top < c.bottom &&
    p.bottom > c.top
  ) {
    score++;
    document.getElementById("score").innerText = "Score: " + score;
    coin.style.left = (10 + Math.random() * 80) + "%";
  }
}, 50);
</script>
