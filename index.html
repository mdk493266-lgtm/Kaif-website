<!DOCTYPE html>
<html>
<head>
  <title>Cube</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      margin:0;
      background:#222;
      color:white;
      text-align:center;
      font-family:Arial;
      overflow:hidden;
    }
    #score{
      margin:15px;
      font-size:24px;
    }
    #player{
      width:60px;
      height:60px;
      background:#00ff66;
      border-radius:50%;
      position:fixed;
      left:50%;
      bottom:80px;
      transform:translateX(-50%);
    }
    #coin{
      width:30px;
      height:30px;
      background:gold;
      border-radius:50%;
      position:fixed;
      left:70%;
      bottom:95px;
    }
    button{
      margin:8px;
      padding:12px 18px;
      font-size:18px;
    }
  </style>
</head>
<body>

<h1>Cube</h1>
<div id="score">Score: 0</div>
<div id="player"></div>
<div id="coin"></div>

<button onclick="move(-10)">⬅️</button>
<button onclick="jump()">⬆️</button>
<button onclick="move(10)">➡️</button>

<script>
let x=50;
let score=0;

function move(step){
  x+=step;
  if(x<10)x=10;
  if(x>90)x=90;
  document.getElementById("player").style.left=x+"%";
  checkCoin();
}

function jump(){
  let p=document.getElementById("player");
  p.style.bottom="170px";
  setTimeout(()=>{
    p.style.bottom="80px";
    checkCoin();
  },300);
}

function checkCoin(){
  let p=document.getElementById("player").getBoundingClientRect();
  let c=document.getElementById("coin").getBoundingClientRect();

  if(p.left<c.right && p.right>c.left && p.top<c.bottom && p.bottom>c.top){
    score++;
    document.getElementById("score").innerText="Score: "+score;
    document.getElementById("coin").style.left=(10+Math.random()*80)+"%";
  }
}
</script>

</body>
</html>
